name: Release
on:
  push:
    # The initial release is published locally before a trusted publisher can be registered.
    tags: ["v*", "!v0.1.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32

      - name: Check that the tag matches the crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(nix develop --command cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "tuiframework") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected v$version for this Cargo.toml, got $GITHUB_REF_NAME"
            exit 1
          fi

      - run: nix develop --command just check
      - run: nix develop --command just publish-dry-run

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: nix develop --command just publish
